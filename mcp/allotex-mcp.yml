tools_note: No tool list is recorded. tools/list is auth-gated and no published tool inventory exists
  to fall back on - Allotex ships no llms.txt and no documentation of this endpoint. Enumerating tools
  by guessing at the WordPress MCP Adapter's defaults would be fabrication, so the list is left empty.
why_no_mcpserver_pointer: Three reasons, all of them evidence rather than judgement. (1) The only authentication
  method the route index advertises is WordPress application passwords, issued exclusively to user accounts
  on the site's own wp-admin; Allotex operates no public signup, so a developer cannot obtain a credential
  by any route. (2) Allotex does not document, reference or market this endpoint anywhere on its site
  - it is the default server the MCP Adapter plugin registers on activation, not a product decision the
  company communicated. (3) The enrichment contract asks for an "official hosted/remote MCP server"; a
  plugin default that returns 401 to every caller is not one. This matches the treatment of the same gated
  Abilities API at all/nacuity-pharmaceuticals/. If Allotex later documents this endpoint and issues credentials,
  the pointer should be added.
