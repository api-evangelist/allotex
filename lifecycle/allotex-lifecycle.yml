api: allotex:allotex-content-api

summary: >-
  Allotex publishes no lifecycle commitments of any kind for this surface. There is no versioning
  policy, no deprecation policy, no Sunset/Deprecation header support, no SLA, no uptime target,
  no status page and no changelog. This is expected: the surface is the company's marketing site's
  own CMS API, not a product. The versioning below is the upstream WordPress namespace, which
  Allotex inherits rather than governs. No `StatusPage`, `Deprecation` or `ChangeLog` pointer is
  emitted, because none of those pages exist.

versioning:
  scheme: uri-path-namespace
  current: wp/v2
  governed_by: upstream WordPress core, not Allotex
  docs: https://developer.wordpress.org/rest-api/
  detail: >-
    The version segment is part of the route (/wp-json/wp/v2/...). A consumer's practical version
    risk is not a WordPress major-version bump but a plugin change on the Allotex install: the
    route index already carries rankmath, elementor, sliderrevolution, contact-form-7, fluent-smtp,
    wp-abilities and mcp namespaces, and those come and go with plugin activation without notice.

