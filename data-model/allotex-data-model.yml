  note: >-
    The slugs do not match the titles. "Our Team" lives at /about-us/leadership/, "Medical Advisory
    Board" at /about-us/clinical-leaders/, "Conditions We Treat" at /about-us/founders/, "Careers"
    at /about-us/our-team/, and "History" at /tissue-processing/eu-footer/. A consumer must key on
    id or title, never on slug.

gaps:
- >-
  No custom post types. A company whose value is a regulated medical device publishes zero
  structured records about that device - no Product, no ClinicalTrial, no Publication, no
  PressRelease entity. Everything is unstructured HTML inside Page.content.rendered.
- >-
  Post meta is not projected into REST, so the Elementor page-builder structure behind each page is
  invisible; only the rendered HTML is retrievable.
