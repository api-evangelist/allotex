apis:
- aid: allotex:allotex-content-api
  name: Allotex Content API
  description: >-
    The anonymously readable WordPress REST API behind us.allotex.com. It exposes the 16 published
    corporate pages (Home, For Europe, About Us, Science, History, Conditions We Treat, Procedure,
    Refractive Surgeons, Medical Advisory Board, Our Team, Careers, Press, Conferences, Blog,
    Contact and Privacy Policy), the 218-item media library with its generated size variants, the
    category and tag taxonomies, the registered post types, taxonomies and statuses, public author
    records, cross-content search, block-based navigation, and the oEmbed 1.0 provider endpoint.
    Two things a consumer must know. First, unlike many Elementor-built sites, content.rendered IS
    populated here, so the full prose of every corporate and clinical page is retrievable, which
    makes this a usable source for the company's own account of its science, its device history
    and the conditions it treats. Second, the posts collection is registered but EMPTY: the Press
    page directs readers to Allotex's LinkedIn page for news rather than publishing an on-site
    article feed, so there is nothing to poll for announcements. This is not a developer product
    Allotex markets; it is the site's own content surface, registered at /wp-json/ and verified to
    return data without credentials. The OpenAPI in this repo is derived from the published route
    index.
  humanURL: https://developer.wordpress.org/rest-api/
  baseURL: https://us.allotex.com/wp-json
  tags:
  - content
  - wordpress
  - corporate
  - media
  - oembed
  properties:
