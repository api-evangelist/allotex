aid: allotex
name: Allotex
description: >-
  Allotex Inc. is an ophthalmic biologics and medical device company headquartered at 27-43
  Wormwood Street, Suite 160, Boston, Massachusetts, with European operations. Founded by Drs.
  Michael Mrochen and David Muller, it develops tissue-addition therapies for presbyopia,
  hyperopia and myopia. Its lead product, the Allotex TransForm corneal allograft, is a
  20-micron-thick, 2.75mm-diameter disc of acellular human donor cornea shaped with an excimer
  laser under OCT measurement, sterilised by electron-beam radiation and shelf-stable for two
  years, implanted beneath a femtosecond-laser flap or on the corneal surface where it integrates
  with the patient's own cornea as, in the company's framing, a permanent living contact lens.
  Because the implant adds biocompatible human tissue rather than ablating tissue or inserting a
  synthetic inlay, the company positions the procedure as removable and replaceable. Allotex has
  run TransForm clinical trials for hyperopia and for intrastromal and sub-epithelial presbyopia
  correction, submitted an IDE to the U.S. FDA in May 2025 for its Allo-1 corneal implant, received
  FDA IDE approval for a U.S. presbyopia study in January 2026, and partners with Daicel High
  Performance Polymers and its TOPAS Advanced Polymers business on next-generation allograft
  technology. Allotex runs no developer program and publishes no product API, no developer portal,
  no API reference, no SDKs and no status page. The only machine-readable surface reachable without
  credentials is the WordPress REST content API behind us.allotex.com, catalogued here.
