    url: errors/allotex-problem-types.yml
  - type: Conventions
    url: conventions/allotex-conventions.yml
  - type: DataModel
    url: data-model/allotex-data-model.yml
  - type: JSONLD
    url: json-ld/allotex-json-ld.yml
  x-contract-provenance: >-
    Derived by the API Evangelist enrichment pipeline from the WordPress REST route index the site
    publishes at https://us.allotex.com/wp-json/ - 270 routes across the namespaces oembed/1.0,
    fluent-smtp, contact-form-7/v1, sliderrevolution, rankmath/v1 (and its setupWizard,
    ai-visibility, an, in and status children), elementor-one/v1, elementor/v1,
    elementor/v1/documents, elementor-ai/v1, elementor/v1/feedback, mcp, wp/v2,
    wp-site-health/v1, wp-block-editor/v1 and wp-abilities/v1 - and verified against live anonymous
    responses on 2026-08-06. Only the 25 operations that returned data without credentials are
    modelled. Notably the site registers BOTH the WordPress Abilities API (wp-abilities/v1) and an
    MCP Adapter default server (/mcp/mcp-adapter-default-server, advertised anonymously at
    /wp-json/mcp with GET/POST/DELETE), but a JSON-RPC tools/list POST to the server returns 401
    rest_forbidden and every wp-abilities/v1 endpoint returns 401 rest_forbidden, so no MCP or
    agent surface is claimed for this provider - see mcp/allotex-mcp.yml. /wp/v2/settings,
    /wp/v2/menu-items, /wp/v2/themes, /wp/v2/plugins and /wp/v2/block-patterns/patterns all return
    401 rest_forbidden; /contact-form-7/v1/contact-forms returns 403 wpcf7_forbidden. The sibling
    host allotex.com serves the same WordPress multisite install as a one-page splash gate: its
    /wp/v2/posts collection returns 6 unmodified Elementor demo-theme articles ("18 Productivity
    Tips for Remote Working", "How to Do a SWOT Analysis") and its /wp/v2/comments collection
    returns 9,551 unmoderated spam records against them - none of it Allotex material, so it is
    recorded as a second server but not treated as content. Allotex publishes no developer
    documentation, no API reference, no getting-started guide, no changelog, no status page and no
    support channel for this surface, so no Documentation/APIReference/GettingStarted/ChangeLog/
    StatusPage pointers are emitted; the humanURL above is the upstream WordPress REST handbook
    that defines the wp/v2 contract.
